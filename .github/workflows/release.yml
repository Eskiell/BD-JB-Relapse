name: Build and release

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # makefs_termux is NetBSD-derived C (-std=c11, -static) that gcc-14 on
    # ubuntu-24.04 rejects; pin to 22.04 (gcc-11) so the disc tooling builds.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout BD-JB-Relapse
        uses: actions/checkout@v4

      - name: Checkout bdj-sdk
        uses: actions/checkout@v4
        with:
          repository: john-tornblom/bdj-sdk
          path: bdj-sdk
          submodules: recursive

      - name: Checkout BD-JB5 loader
        uses: actions/checkout@v4
        with:
          repository: Gezine/BD-JB5
          ref: '2.0'
          path: BD-JB5

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install disc tooling (makefs build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbsd-dev pkg-config

      - name: Build bdj-sdk host tools and stubs
        run: |
          set -e
          ln -sf "$JAVA_HOME" bdj-sdk/host/jdk8
          make -C bdj-sdk/host/src/makefs_termux
          make -C bdj-sdk/host/src/makefs_termux install DESTDIR="$PWD/bdj-sdk/host"
          make -C bdj-sdk/target JAVA8_HOME="$JAVA_HOME"

      # Relapse sources target -source/-target 1.4 (BD-J VM bytecode) -> JDK 8.
      # bdj-sdk ships enhanced-stubs.zip; sony-stubs.jar is built above. No
      # proprietary firmware jars are needed.
      - name: Build Relapse.jar
        run: make BDJSDK_HOME="$GITHUB_WORKSPACE/bdj-sdk" JAVA8_HOME="$JAVA_HOME"

      - name: Sanity check Relapse.jar
        run: |
          set -e
          jar tf Relapse.jar | grep -q 'org/bdj/external/Relapse.class'
          jar tf Relapse.jar | grep -q 'org/bdj/external/kexp_2026_10_26.bin'
          jar tf Relapse.jar | grep -q 'org/bdj/external/elfldr-ps5-0.27.elf'
          unzip -p Relapse.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: org.bdj.external.Relapse'
          unzip -p Relapse.jar org/bdj/external/Relapse.class | head -c 8 | od -An -tu1 -j6 -N2 | grep -qw 48
          echo "Relapse.jar OK"

      # Bundle Relapse.jar into a bootable BD-RE disc built from Gezine/BD-JB5.
      # InitXlet.UseInternalJar=true makes the loader auto-run /disc/payload.jar
      # (the BD-JB5 InternalJarLoader) instead of waiting for a network push, so
      # inserting the disc escapes the BD-J sandbox and launches Relapse directly.
      - name: Build bootable ISO (BD-JB5 + bundled Relapse.jar)
        run: |
          set -e
          export JAVA8_HOME="$JAVA_HOME"            # bdsigner reads JAVA8_HOME
          SDK="$GITHUB_WORKSPACE/bdj-sdk"
          BJ="$GITHUB_WORKSPACE/BD-JB5"
          ES="$SDK/target/lib/enhanced-stubs.zip"
          SONY="$SDK/target/lib/sony-stubs.jar"
          ISO="$GITHUB_WORKSPACE/BD-JB-Relapse-${GITHUB_REF_NAME}.iso"

          sed -i 's/UseInternalJar = false/UseInternalJar = true/' "$BJ/src/org/bdj/InitXlet.java"
          grep -q 'UseInternalJar = true' "$BJ/src/org/bdj/InitXlet.java"

          cd "$BJ"
          SRC=$(find src/jdk/internal/misc src/org/bdj src/org/bdj/api src/org/bdj/sandbox -maxdepth 1 -name '*.java')
          # -XDignore.symbol.file lets the loader import sun.launcher / jdk.internal
          "$JAVA_HOME/bin/javac" -XDignore.symbol.file=true -Xlint:-options \
            -source 1.4 -target 1.4 -cp "$ES:$SONY" $SRC

          D="$GITHUB_WORKSPACE/discdir"; mkdir -p "$D/BDMV/JAR"
          cp -r "$SDK/resources/AVCHD/." "$D/"
          cp -r BDMV/META "$D/BDMV/"
          cp -r BDMV/BDJO "$D/BDMV/"
          "$JAVA_HOME/bin/jar" cf "$D/BDMV/JAR/00000.jar" -C src .
          "$SDK/host/bin/bdsigner" -keystore "$SDK/resources/sig.ks" "$D/BDMV/JAR/00000.jar"
          "$JAVA_HOME/bin/jar" cfM "$D/BDMV/JAR/00001.jar" -C 00001 .
          cp "$GITHUB_WORKSPACE/Relapse.jar" "$D/payload.jar"

          "$SDK/host/bin/makefs" -m 16m -t udf -o T=bdre,v=2.50,L=BD-JB-Relapse "$ISO" "$D"
          ls -la "$ISO"
          # sanity: disc carries the bundled payload and the signed loader
          test -f "$D/payload.jar"
          unzip -l "$D/BDMV/JAR/00000.jar" | grep -q 'SIG-BD00'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BD-JB-Relapse
          path: |
            Relapse.jar
            BD-JB-Relapse-*.iso
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Relapse.jar
            BD-JB-Relapse-${{ github.ref_name }}.iso
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
